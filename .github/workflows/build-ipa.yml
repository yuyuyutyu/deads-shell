name: build-unsigned-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project DeAdsShell.xcodeproj \
            -scheme DeAdsShell \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/DeAdsShell.app Payload/
          zip -qry DeAdsShell-unsigned.ipa Payload
          ls -lh DeAdsShell-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeAdsShell-unsigned-ipa
          path: DeAdsShell-unsigned.ipa
          retention-days: 7
